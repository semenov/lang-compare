[package]
name = "search"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
memmap2 = "0.9.11"
mimalloc = "0.1.52"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "macros"] }
unicode-general-category = "1.1.0"
zstd = "0.14.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
